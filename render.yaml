databases:
  - name: collectiq-db
    databaseName: collectiq
    user: collectiq
    plan: free
    region: singapore

services:
  - type: web
    name: collectiq-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: collectiq-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: collectiq-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: collectiq-db
          property: password
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COLLECTION_TIMEZONE
        value: Asia/Kolkata
  - type: web
    name: collectiq-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/agent/Dockerfile
    dockerContext: ./services/agent
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
  - type: web
    name: collectiq-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
